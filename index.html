<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dial">
<meta name="theme-color" content="#1C1E24">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #1C1E24;
    --panel: #23262E;
    --panel-2: #292C35;
    --hairline: #33363F;
    --amber: #E8A33D;
    --amber-dim: rgba(232,163,61,0.16);
    --text: #EDE7DA;
    --text-dim: #8A8D95;
    --text-faint: #5B5E66;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
    overscroll-behavior-y: none;
  }

  .app{
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 6px;
  }

  .brand{
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    font-weight: 500;
  }

  .live-indicator{
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    transition: color .3s ease;
  }
  .live-indicator .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background .3s ease, box-shadow .3s ease;
  }
  .live-indicator.on{ color: var(--amber); }
  .live-indicator.on .dot{
    background: var(--amber);
    box-shadow: 0 0 8px 1px var(--amber);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  main{
    padding: 8px 22px 16px;
    border-bottom: 1px solid var(--hairline);
  }

  .now-playing{
    padding: 14px 0 18px;
  }
  .now-playing h1{
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .now-playing p{
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .trackCard{
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 12px;
  }
  .artwork{
    width: 52px;
    height: 52px;
    border-radius: 8px;
    background: var(--panel-2);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
  }
  .artwork svg{ width: 22px; height: 22px; }
  .artwork img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .trackText{
    min-width: 0;
    flex: 1;
  }
  .trackTitle{
    font-family: 'Space Grotesk', sans-serif !important;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0 0 2px !important;
  }
  .trackArtist{
    font-size: 12px !important;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0 0 6px !important;
  }
  .spotifyLink{
    display: none;
    align-items: center;
    gap: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--amber);
    text-decoration: none;
  }
  .spotifyLink svg{ width: 12px; height: 12px; }

  .tabsWrap{
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 -22px 24px;
    padding: 0 22px;
  }
  .tabsWrap::-webkit-scrollbar{ display: none; }

  .tabs{
    position: relative;
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 12px;
    white-space: nowrap;
  }

  .tab{
    appearance: none;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 0;
    cursor: pointer;
    transition: color .25s ease;
    flex-shrink: 0;
  }
  .tab.active{ color: var(--amber); }

  .tabUnderline{
    position: absolute;
    bottom: -1px;
    height: 2px;
    background: var(--amber);
    box-shadow: 0 0 8px 1px var(--amber-dim);
    transition: left .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1);
  }

  .playRow{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-bottom: 6px;
  }

  .controls{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .skipBtn{
    appearance: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .2s ease, color .2s ease, opacity .2s ease;
  }
  .skipBtn svg{ width: 18px; height: 18px; }
  .skipBtn:disabled{ opacity: 0.3; }
  .skipBtn:active:not(:disabled){ border-color: var(--amber); color: var(--amber); }

  .playBtn{
    appearance: none;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .playBtn svg{ width: 24px; height: 24px; }
  .playBtn:disabled{ opacity: 0.4; }
  .playBtn.playing{
    border-color: var(--amber);
    box-shadow: 0 0 0 6px var(--amber-dim);
  }

  .status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    min-height: 16px;
    margin: 0;
  }

  .presetList{
    list-style: none;
    margin: 0;
    padding: 6px 8px 40px;
    flex: 1;
  }
  .presetRow{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 14px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    transition: background .2s ease;
  }
  .presetRow:active{ background: var(--panel); }
  .presetRow.active{ background: var(--panel-2); }

  .presetNum{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-faint);
    width: 22px;
    flex-shrink: 0;
  }
  .presetRow.active .presetNum{ color: var(--amber); }

  .presetInfo{
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }
  .presetName{
    font-size: 15px;
    font-weight: 500;
  }
  .presetMeta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .presetPlay{
    font-size: 11px;
    color: var(--text-faint);
    opacity: 0;
    transition: opacity .2s ease;
  }
  .presetRow.active .presetPlay{
    opacity: 1;
    color: var(--amber);
  }

  @media (prefers-reduced-motion: reduce){
    .tabUnderline, .live-indicator .dot{ transition: none; animation: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="brand">DIAL</span>
      <span class="live-indicator" id="liveIndicator"><span class="dot"></span>LIVE</span>
    </header>

    <main>
      <div class="now-playing">
        <h1 id="stationName">Pick a preset</h1>
        <p id="stationSub">Eight networks, 45 channels total</p>

        <div class="trackCard" id="trackCard">
          <div class="artwork" id="artwork">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <img id="artworkImg" alt="">
          </div>
          <div class="trackText">
            <p class="trackTitle" id="trackTitle"></p>
            <p class="trackArtist" id="trackArtist"></p>
            <a class="spotifyLink" id="spotifyLink" href="#" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.6 14.4c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.9-9.3-1-.4.1-.7-.1-.8-.5-.1-.4.1-.7.5-.8 4-.9 7.5-.5 10.3 1.2.3.2.4.6.2.9zm1.2-2.7c-.2.3-.7.5-1 .3-2.9-1.8-7.3-2.3-10.7-1.3-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 3.9-1.2 8.7-.6 12 1.5.4.2.5.7.2 1zm.1-2.8C14.3 8.8 8.9 8.6 5.7 9.6c-.5.1-1-.2-1.1-.6-.1-.5.2-1 .6-1.1 3.7-1.1 9.7-.9 13.5 1.4.4.3.6.9.3 1.3-.3.4-.9.5-1.3.3z"></path></svg>
              Search on Spotify
            </a>
          </div>
        </div>
      </div>

      <div class="tabsWrap">
        <div class="tabs" id="tabs">
          <div class="tabUnderline" id="tabUnderline"></div>
        </div>
      </div>

      <div class="playRow">
        <div class="controls">
          <button class="skipBtn" id="shuffleBtn" aria-label="Shuffle channel"></button>
          <button class="skipBtn" id="prevBtn" disabled aria-label="Previous channel"></button>
          <button class="playBtn" id="playBtn" disabled aria-label="Play"></button>
          <button class="skipBtn" id="nextBtn" disabled aria-label="Next channel"></button>
        </div>
        <p class="status" id="status"></p>
      </div>
    </main>

    <ul class="presetList" id="presetList"></ul>
  </div>

<audio id="audio" preload="none"></audio>

<script>
  const networks = [
    { id: 'fip',  label: 'FIP',            place: 'Paris' },
    { id: 'rp',   label: 'Radio Paradise', place: 'California' },
    { id: 'soma', label: 'SomaFM',         place: 'San Francisco' },
    { id: 'nts',  label: 'NTS',            place: 'London' },
    { id: 'club', label: 'Club',           place: 'Various' },
    { id: 'piano', label: 'Piano',         place: 'MPR' },
    { id: 'cbc',  label: 'CBC',            place: 'Toronto' },
    { id: 'bbc',  label: 'BBC',            place: 'London' },
  ];

  // `now` describes how to fetch now-playing metadata for a channel. Omitted = no metadata attempted.
  const stations = [
    // FIP — pull IDs confirmed for 9 of 12 webradios; Pop/Hip-Hop/Sacré Français have no documented ID
    { network:'fip', name:'FIP',                 genre:'Eclectic mix',       url:'https://icecast.radiofrance.fr/fip-midfi.mp3?id=radiofrance', now:{type:'fip', id:7} },
    { network:'fip', name:'FIP Pop',              genre:'Pop',                url:'https://icecast.radiofrance.fr/fippop-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Rock',             genre:'Rock',               url:'https://icecast.radiofrance.fr/fiprock-midfi.mp3?id=radiofrance', now:{type:'fip', id:64} },
    { network:'fip', name:'FIP Jazz',             genre:'Jazz',               url:'https://icecast.radiofrance.fr/fipjazz-midfi.mp3?id=radiofrance', now:{type:'fip', id:65} },
    { network:'fip', name:'FIP Groove',           genre:'Groove · funk · soul', url:'https://icecast.radiofrance.fr/fipgroove-midfi.mp3?id=radiofrance', now:{type:'fip', id:66} },
    { network:'fip', name:'FIP Reggae',           genre:'Reggae',             url:'https://icecast.radiofrance.fr/fipreggae-midfi.mp3?id=radiofrance', now:{type:'fip', id:71} },
    { network:'fip', name:'FIP Electro',          genre:'Electro',            url:'https://icecast.radiofrance.fr/fipelectro-midfi.mp3?id=radiofrance', now:{type:'fip', id:74} },
    { network:'fip', name:'FIP Metal',            genre:'Metal',              url:'https://icecast.radiofrance.fr/fipmetal-midfi.mp3?id=radiofrance', now:{type:'fip', id:77} },
    { network:'fip', name:'FIP Hip-Hop',          genre:'Hip-hop',            url:'https://icecast.radiofrance.fr/fiphiphop-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Monde',            genre:'World',              url:'https://icecast.radiofrance.fr/fipworld-midfi.mp3?id=radiofrance', now:{type:'fip', id:69} },
    { network:'fip', name:'FIP Nouveautés',       genre:'New releases',       url:'https://icecast.radiofrance.fr/fipnouveautes-midfi.mp3?id=radiofrance', now:{type:'fip', id:70} },
    { network:'fip', name:'FIP Sacré Français',   genre:'French chanson',     url:'https://icecast.radiofrance.fr/fipsacrefrancais-midfi.mp3?id=radiofrance' },

    // Radio Paradise — its four mixes (no metadata: undocumented per-mix channel param + historic CORS issues)
    { network:'rp', name:'Main Mix',   genre:'Rock · eclectic',  url:'https://stream.radioparadise.com/mp3-192' },
    { network:'rp', name:'Mellow Mix', genre:'Chill · acoustic', url:'https://stream.radioparadise.com/mellow-192' },
    { network:'rp', name:'Rock Mix',   genre:'Rock-focused',     url:'https://stream.radioparadise.com/rock-192' },
    { network:'rp', name:'Global Mix', genre:'World · eclectic', url:'https://stream.radioparadise.com/world-etc-192' },

    // SomaFM — no metadata: their third-party API was officially discontinued
    { network:'soma', name:'Groove Salad',     genre:'Ambient · downtempo', url:'https://ice1.somafm.com/groovesalad-128-mp3' },
    { network:'soma', name:'Secret Agent',     genre:'Lounge · spy jazz',   url:'https://ice1.somafm.com/secretagent-128-mp3' },
    { network:'soma', name:'Drone Zone',       genre:'Deep ambient',       url:'https://ice1.somafm.com/dronezone-128-mp3' },
    { network:'soma', name:'Indie Pop Rocks',  genre:'Indie pop',          url:'https://ice1.somafm.com/indiepop-128-mp3' },
    { network:'soma', name:'Left Coast 70s',   genre:'70s album rock',     url:'https://ice1.somafm.com/seventies-128-mp3' },
    { network:'soma', name:'Underground 80s',  genre:'80s synthpop',       url:'https://ice1.somafm.com/u80s-128-mp3' },
    { network:'soma', name:'Lush',             genre:'Mellow vocals',      url:'https://ice1.somafm.com/lush-128-mp3' },
    { network:'soma', name:'Space Station',    genre:'Space music',        url:'https://ice1.somafm.com/spacestation-128-mp3' },

    // NTS — live channels show DJ/show name + artwork; Infinite Mixtapes have no confirmed metadata endpoint
    { network:'nts', name:'NTS 1',          genre:'Underground · global',   url:'https://stream-relay-geo.ntslive.net/stream', now:{type:'nts', channel:'1'} },
    { network:'nts', name:'NTS 2',          genre:'Leftfield · experimental', url:'https://stream-relay-geo.ntslive.net/stream2', now:{type:'nts', channel:'2'} },
    { network:'nts', name:'Poolside',       genre:'Balearic · disco',       url:'https://stream-mixtape-geo.ntslive.net/mixtape4' },
    { network:'nts', name:'Slow Focus',     genre:'Ambient · drone',        url:'https://stream-mixtape-geo.ntslive.net/mixtape' },
    { network:'nts', name:'Memory Lane',    genre:'Psych folk · garage',    url:'https://stream-mixtape-geo.ntslive.net/mixtape6' },
    { network:'nts', name:'4 to the Floor', genre:'House · club',           url:'https://stream-mixtape-geo.ntslive.net/mixtape5' },

    // Club — house, techno, and UK dance music from across Europe
    { network:'club', name:'Rinse UK',        genre:'Garage · grime · dubstep', url:'https://admin.stream.rinse.fm/proxy/rinse_uk/stream' },
    { network:'club', name:'Soho Radio',      genre:'House · electronic',       url:'https://sohoradiomusic.doughunt.co.uk:8010/320mp3' },
    { network:'club', name:'Refuge Worldwide', genre:'Dance · techno (Berlin)', url:'https://streaming.radio.co/s3699c5e49/listen' },
    { network:'club', name:'Blue Marlin Ibiza', genre:'House · lounge (Ibiza)', url:'https://ibizasonica.streaming-pro.com:8001/bluemarlin' },
    { network:'club', name:'Radio Meuh',      genre:'Electronic · funk (French Alps)', url:'http://radiomeuh.ice.infomaniak.ch/radiomeuh-128.mp3' },
    { network:'club', name:'Kiosk Radio',     genre:'Electronic · jazz (Brussels)', url:'https://kioskradiobxl.out.airtime.pro/kioskradiobxl_b' },
    { network:'club', name:'Sub.FM',          genre:'Dubstep · jungle · techno', url:'http://subfm.radioca.st/Sub.FM' },
    { network:'club', name:'TM Radio',        genre:'Progressive · tech house',  url:'https://stream.tm-radio.com/tribalmixes' },

    // Piano — from YourClassical (Minnesota Public Radio), listener-supported and ad-free
    { network:'piano', name:'Peaceful Piano', genre:'Solo piano',      url:'https://peacefulpiano.stream.publicradio.org/peacefulpiano.aac' },
    { network:'piano', name:'Relax',          genre:'Piano · ambient', url:'https://relax.stream.publicradio.org/relax.aac' },

    // CBC Music — the genre-specific StreamTheWorld streams turned out to be unreachable from
    // a browser (their .pls metadata isn't CORS-enabled for third-party fetch). These use CBC's
    // main HLS feed instead — same reliable Akamai setup that's working for the BBC channels below.
    { network:'cbc', name:'CBC Music (Toronto)',    genre:'General · classical middays', url:'https://cbcradiolive.akamaized.net/hls/live/2041057/ES_R2ETR/master.m3u8' },
    { network:'cbc', name:'CBC Music (Vancouver)',  genre:'General · classical middays', url:'https://cbcradiolive.akamaized.net/hls/live/2041059/ES_R2PVC/master.m3u8' },

    // BBC — direct https HLS. lstn.lv (used previously) resolves to plain http, which gets
    // blocked as mixed content on an https-hosted page — these bypass it with a known-good
    // pool URL. BBC rotates these periodically; if one goes dead, it needs a fresh pool number.
    { network:'bbc', name:'Radio 1 Dance', genre:'EDM · house',       url:'https://as-hls-ww-live.akamaized.net/pool_62063831/live/ww/bbc_radio_one_dance/bbc_radio_one_dance.isml/bbc_radio_one_dance-audio=96000.norewind.m3u8' },
    { network:'bbc', name:'6 Music',       genre:'Alt · indie',       url:'https://as-hls-ww-live.akamaized.net/pool_81827798/live/ww/bbc_6music/bbc_6music.isml/bbc_6music-audio=96000.norewind.m3u8' },
    { network:'bbc', name:'Radio 3',       genre:'Classical · piano', url:'https://as-hls-ww-live.akamaized.net/pool_23461179/live/ww/bbc_radio_three/bbc_radio_three.isml/bbc_radio_three-audio=96000.norewind.m3u8' },
  ];

  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  const PREV_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
  const NEXT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
  const SHUFFLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>';

  let currentIndex = null;
  let activeNetwork = networks[0].id;
  let npTimer = null;
  let npRequestId = 0;

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const stationName = document.getElementById('stationName');
  const stationSub = document.getElementById('stationSub');
  const statusEl = document.getElementById('status');
  const tabsEl = document.getElementById('tabs');
  const tabUnderline = document.getElementById('tabUnderline');
  const presetList = document.getElementById('presetList');
  const liveIndicator = document.getElementById('liveIndicator');
  const trackCard = document.getElementById('trackCard');
  const trackTitleEl = document.getElementById('trackTitle');
  const trackArtistEl = document.getElementById('trackArtist');
  const artworkImg = document.getElementById('artworkImg');
  const spotifyLink = document.getElementById('spotifyLink');

  function pad(n){ return String(n).padStart(2, '0'); }
  function networkLabel(id){ return networks.find(n => n.id === id).label; }
  function currentGroup(){ return stations.filter(s => s.network === activeNetwork); }
  function indexWithinGroup(){
    if(currentIndex === null) return -1;
    return currentGroup().findIndex(s => stations.indexOf(s) === currentIndex);
  }

  function buildTabs(){
    networks.forEach(net => {
      const tab = document.createElement('button');
      tab.className = 'tab';
      tab.textContent = net.label;
      tab.dataset.id = net.id;
      tab.addEventListener('click', () => selectNetwork(net.id));
      tabsEl.appendChild(tab);
    });
  }

  function selectNetwork(id){
    activeNetwork = id;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.id === id);
    });
    positionUnderline();
    renderPresetList();
    updateSkipButtons();
  }

  function positionUnderline(){
    const activeTab = document.querySelector('.tab.active');
    if(!activeTab) return;
    tabUnderline.style.left = activeTab.offsetLeft + 'px';
    tabUnderline.style.width = activeTab.offsetWidth + 'px';
  }

  function renderPresetList(){
    presetList.innerHTML = '';
    const filtered = currentGroup();
    filtered.forEach((s, i) => {
      const globalIndex = stations.indexOf(s);
      const li = document.createElement('li');
      li.className = 'presetRow';
      if(globalIndex === currentIndex) li.classList.add('active');
      li.innerHTML =
        '<span class="presetNum">' + pad(i + 1) + '</span>' +
        '<span class="presetInfo">' +
          '<span class="presetName">' + s.name + '</span>' +
          '<span class="presetMeta">' + s.genre + '</span>' +
        '</span>' +
        '<span class="presetPlay">NOW</span>';
      li.addEventListener('click', () => selectStation(globalIndex));
      presetList.appendChild(li);
    });
  }

  function selectStation(i){
    currentIndex = i;
    const s = stations[i];
    stationName.textContent = s.name;
    stationSub.textContent = networkLabel(s.network) + ' · ' + s.genre;
    playBtn.disabled = false;
    hideTrackCard();
    if(activeNetwork !== s.network){ selectNetwork(s.network); }
    else { renderPresetList(); updateSkipButtons(); }
    playCurrent();
  }

  function playCurrent(){
    if(currentIndex === null) return;
    const s = stations[currentIndex];
    if(audio.src !== s.url){ audio.src = s.url; }
    statusEl.textContent = 'Connecting…';
    audio.play().catch(() => {
      statusEl.textContent = "Couldn't connect — try another preset";
    });
  }

  function stepStation(delta){
    const filtered = currentGroup();
    const curFiltered = indexWithinGroup();
    if(curFiltered === -1) return;
    const next = curFiltered + delta;
    if(next < 0 || next > filtered.length - 1) return;
    selectStation(stations.indexOf(filtered[next]));
  }

  function shuffleChannel(){
    if(stations.length <= 1) return;
    let idx;
    do {
      idx = Math.floor(Math.random() * stations.length);
    } while(idx === currentIndex);
    selectStation(idx);
  }

  function updateSkipButtons(){
    const curFiltered = indexWithinGroup();
    const filtered = currentGroup();
    prevBtn.disabled = curFiltered <= 0;
    nextBtn.disabled = curFiltered === -1 || curFiltered >= filtered.length - 1;
  }

  function updatePlayIcon(isPlaying){
    playBtn.innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG;
    playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
    playBtn.classList.toggle('playing', isPlaying);
  }

  // ---------- Now playing metadata ----------

  function hideTrackCard(){
    trackCard.style.display = 'none';
    artworkImg.style.display = 'none';
    spotifyLink.style.display = 'none';
  }

  function showTrackCard(title, artist, coverUrl, spotifyQuery){
    trackTitleEl.textContent = title;
    trackArtistEl.textContent = artist || '';
    trackArtistEl.style.display = artist ? 'block' : 'none';
    if(coverUrl){
      artworkImg.onerror = () => { artworkImg.style.display = 'none'; };
      artworkImg.onload = () => { artworkImg.style.display = 'block'; };
      artworkImg.src = coverUrl;
    } else {
      artworkImg.style.display = 'none';
    }
    if(spotifyQuery){
      spotifyLink.href = 'https://open.spotify.com/search/' + encodeURIComponent(spotifyQuery);
      spotifyLink.style.display = 'inline-flex';
    } else {
      spotifyLink.style.display = 'none';
    }
    trackCard.style.display = 'flex';
  }

  async function fetchFipNow(id){
    const res = await fetch('https://api.radiofrance.fr/livemeta/pull/' + id);
    if(!res.ok) return null;
    const data = await res.json();
    const stepsObj = data.steps || {};
    const list = Object.values(stepsObj);
    if(!list.length) return null;
    const now = Math.floor(Date.now() / 1000);
    let entry = list.find(s => s && typeof s.start === 'number' && typeof s.end === 'number' && now >= s.start && now < s.end);
    if(!entry) entry = list[list.length - 2] || list[list.length - 1];
    if(!entry) return null;
    const title = entry.title || entry.song || entry.track;
    const artist = entry.authors || entry.artist || entry.performers;
    const cover = entry.visual || entry.cover || entry.image;
    if(!title || !artist) return null;
    return { title: title, artist: artist, cover: cover, spotifyQuery: artist + ' ' + title };
  }

  async function fetchNtsNow(channel){
    const res = await fetch('https://www.nts.live/api/v2/live');
    if(!res.ok) return null;
    const data = await res.json();
    const entry = (data.results || []).find(r => r.channel_name === channel);
    const now = entry && entry.now;
    if(!now || !now.broadcast_title) return null;
    const media = now.embeds && now.embeds.details && now.embeds.details.media;
    const cover = media && (media.picture_medium || media.picture_large);
    return { title: now.broadcast_title, artist: null, cover: cover, spotifyQuery: null };
  }

  async function fetchNowPlaying(station){
    if(!station.now) return null;
    try{
      if(station.now.type === 'fip') return await fetchFipNow(station.now.id);
      if(station.now.type === 'nts') return await fetchNtsNow(station.now.channel);
    } catch(e){ return null; }
    return null;
  }

  function stopNowPlayingPolling(){
    if(npTimer){ clearInterval(npTimer); npTimer = null; }
  }

  function startNowPlayingPolling(){
    stopNowPlayingPolling();
    const s = stations[currentIndex];
    if(!s || !s.now){ return; }
    const myRequestId = ++npRequestId;
    const poll = async () => {
      const info = await fetchNowPlaying(s);
      if(myRequestId !== npRequestId) return; // station changed while awaiting
      if(!info || !info.title){ hideTrackCard(); return; }
      showTrackCard(info.title, info.artist, info.cover, info.spotifyQuery);
    };
    poll();
    npTimer = setInterval(poll, 20000);
  }

  // ---------- Audio wiring ----------

  audio.addEventListener('playing', () => {
    statusEl.textContent = '';
    updatePlayIcon(true);
    liveIndicator.classList.add('on');
    if(currentIndex !== null){
      const s = stations[currentIndex];
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata = new MediaMetadata({
          title: s.name, artist: networkLabel(s.network), album: s.genre
        });
        navigator.mediaSession.playbackState = 'playing';
      }
      startNowPlayingPolling();
    }
  });

  audio.addEventListener('waiting', () => { statusEl.textContent = 'Buffering…'; });

  audio.addEventListener('error', () => {
    statusEl.textContent = "Couldn't connect — try another preset";
    updatePlayIcon(false);
    liveIndicator.classList.remove('on');
    stopNowPlayingPolling();
    hideTrackCard();
  });

  audio.addEventListener('pause', () => {
    updatePlayIcon(false);
    liveIndicator.classList.remove('on');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    stopNowPlayingPolling();
  });

  playBtn.addEventListener('click', () => {
    if(currentIndex === null) return;
    if(audio.paused){ audio.play().catch(() => {}); }
    else { audio.pause(); }
  });

  prevBtn.addEventListener('click', () => stepStation(-1));
  nextBtn.addEventListener('click', () => stepStation(1));
  shuffleBtn.addEventListener('click', shuffleChannel);

  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => stepStation(-1));
    navigator.mediaSession.setActionHandler('nexttrack', () => stepStation(1));
  }

  window.addEventListener('resize', positionUnderline);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(positionUnderline);
  }

  buildTabs();
  prevBtn.innerHTML = PREV_SVG;
  nextBtn.innerHTML = NEXT_SVG;
  shuffleBtn.innerHTML = SHUFFLE_SVG;
  selectNetwork(activeNetwork);
  updatePlayIcon(false);
</script>
</body>
</html>
