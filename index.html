<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dial">
<meta name="theme-color" content="#1C1E24">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #1C1E24;
    --panel: #23262E;
    --panel-2: #292C35;
    --hairline: #33363F;
    --amber: #E8A33D;
    --amber-dim: rgba(232,163,61,0.16);
    --text: #EDE7DA;
    --text-dim: #8A8D95;
    --text-faint: #5B5E66;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
    overscroll-behavior-y: none;
  }

  .app{
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 6px;
  }

  .brand{
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    font-weight: 500;
  }

  .live-indicator{
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    transition: color .3s ease;
  }
  .live-indicator .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background .3s ease, box-shadow .3s ease;
  }
  .live-indicator.on{ color: var(--amber); }
  .live-indicator.on .dot{
    background: var(--amber);
    box-shadow: 0 0 8px 1px var(--amber);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  main{
    padding: 8px 22px 16px;
    border-bottom: 1px solid var(--hairline);
  }

  .now-playing{
    padding: 14px 0 22px;
    min-height: 74px;
  }
  .now-playing h1{
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .now-playing p{
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .tabsWrap{
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 -22px 24px;
    padding: 0 22px;
  }
  .tabsWrap::-webkit-scrollbar{ display: none; }

  .tabs{
    position: relative;
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 12px;
    white-space: nowrap;
  }

  .tab{
    appearance: none;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 0;
    cursor: pointer;
    transition: color .25s ease;
    flex-shrink: 0;
  }
  .tab.active{ color: var(--amber); }

  .tabUnderline{
    position: absolute;
    bottom: -1px;
    height: 2px;
    background: var(--amber);
    box-shadow: 0 0 8px 1px var(--amber-dim);
    transition: left .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1);
  }

  .playRow{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-bottom: 6px;
  }
  .playBtn{
    appearance: none;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .playBtn svg{ width: 24px; height: 24px; }
  .playBtn:disabled{ opacity: 0.4; }
  .playBtn.playing{
    border-color: var(--amber);
    box-shadow: 0 0 0 6px var(--amber-dim);
  }

  .status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    min-height: 16px;
    margin: 0;
  }

  .presetList{
    list-style: none;
    margin: 0;
    padding: 6px 8px 40px;
    flex: 1;
  }
  .presetRow{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 14px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    transition: background .2s ease;
  }
  .presetRow:active{ background: var(--panel); }
  .presetRow.active{ background: var(--panel-2); }

  .presetNum{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-faint);
    width: 22px;
    flex-shrink: 0;
  }
  .presetRow.active .presetNum{ color: var(--amber); }

  .presetInfo{
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }
  .presetName{
    font-size: 15px;
    font-weight: 500;
  }
  .presetMeta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .presetPlay{
    font-size: 11px;
    color: var(--text-faint);
    opacity: 0;
    transition: opacity .2s ease;
  }
  .presetRow.active .presetPlay{
    opacity: 1;
    color: var(--amber);
  }

  @media (prefers-reduced-motion: reduce){
    .tabUnderline, .live-indicator .dot{ transition: none; animation: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="brand">DIAL</span>
      <span class="live-indicator" id="liveIndicator"><span class="dot"></span>LIVE</span>
    </header>

    <main>
      <div class="now-playing">
        <h1 id="stationName">Pick a preset</h1>
        <p id="stationSub">Six networks, 32 channels total</p>
      </div>

      <div class="tabsWrap">
        <div class="tabs" id="tabs">
          <div class="tabUnderline" id="tabUnderline"></div>
        </div>
      </div>

      <div class="playRow">
        <button class="playBtn" id="playBtn" disabled aria-label="Play"></button>
        <p class="status" id="status"></p>
      </div>
    </main>

    <ul class="presetList" id="presetList"></ul>
  </div>

<audio id="audio" preload="none"></audio>

<script>
  const networks = [
    { id: 'fip',  label: 'FIP',            place: 'Paris' },
    { id: 'rp',   label: 'Radio Paradise', place: 'California' },
    { id: 'soma', label: 'SomaFM',         place: 'San Francisco' },
    { id: 'kexp', label: 'KEXP',           place: 'Seattle' },
    { id: 'kcrw', label: 'KCRW',           place: 'Santa Monica' },
    { id: 'nts',  label: 'NTS',            place: 'London' },
  ];

  const stations = [
    // FIP — full family of webradios
    { network:'fip', name:'FIP',                 genre:'Eclectic mix',       url:'https://icecast.radiofrance.fr/fip-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Pop',              genre:'Pop',                url:'https://icecast.radiofrance.fr/fippop-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Rock',             genre:'Rock',               url:'https://icecast.radiofrance.fr/fiprock-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Jazz',             genre:'Jazz',               url:'https://icecast.radiofrance.fr/fipjazz-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Groove',           genre:'Groove · funk · soul', url:'https://icecast.radiofrance.fr/fipgroove-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Reggae',           genre:'Reggae',             url:'https://icecast.radiofrance.fr/fipreggae-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Electro',          genre:'Electro',            url:'https://icecast.radiofrance.fr/fipelectro-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Metal',            genre:'Metal',              url:'https://icecast.radiofrance.fr/fipmetal-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Hip-Hop',          genre:'Hip-hop',            url:'https://icecast.radiofrance.fr/fiphiphop-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Monde',            genre:'World',              url:'https://icecast.radiofrance.fr/fipworld-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Nouveautés',       genre:'New releases',       url:'https://icecast.radiofrance.fr/fipnouveautes-midfi.mp3?id=radiofrance' },
    { network:'fip', name:'FIP Sacré Français',   genre:'French chanson',     url:'https://icecast.radiofrance.fr/fipsacrefrancais-midfi.mp3?id=radiofrance' },

    // Radio Paradise — its four mixes
    { network:'rp', name:'Main Mix',   genre:'Rock · eclectic',  url:'https://stream.radioparadise.com/mp3-192' },
    { network:'rp', name:'Mellow Mix', genre:'Chill · acoustic', url:'https://stream.radioparadise.com/mellow-192' },
    { network:'rp', name:'Rock Mix',   genre:'Rock-focused',     url:'https://stream.radioparadise.com/rock-192' },
    { network:'rp', name:'Global Mix', genre:'World · eclectic', url:'https://stream.radioparadise.com/world-etc-192' },

    // SomaFM — a spread of its channels
    { network:'soma', name:'Groove Salad',     genre:'Ambient · downtempo', url:'https://ice1.somafm.com/groovesalad-128-mp3' },
    { network:'soma', name:'Secret Agent',     genre:'Lounge · spy jazz',   url:'https://ice1.somafm.com/secretagent-128-mp3' },
    { network:'soma', name:'Drone Zone',       genre:'Deep ambient',       url:'https://ice1.somafm.com/dronezone-128-mp3' },
    { network:'soma', name:'Indie Pop Rocks',  genre:'Indie pop',          url:'https://ice1.somafm.com/indiepop-128-mp3' },
    { network:'soma', name:'Left Coast 70s',   genre:'70s album rock',     url:'https://ice1.somafm.com/seventies-128-mp3' },
    { network:'soma', name:'Underground 80s',  genre:'80s synthpop',       url:'https://ice1.somafm.com/u80s-128-mp3' },
    { network:'soma', name:'Lush',             genre:'Mellow vocals',      url:'https://ice1.somafm.com/lush-128-mp3' },
    { network:'soma', name:'Space Station',    genre:'Space music',        url:'https://ice1.somafm.com/spacestation-128-mp3' },

    // KEXP — single broadcast
    { network:'kexp', name:'KEXP', genre:'Indie · alternative', url:'https://kexp.streamguys1.com/kexp160.aac' },

    // KCRW — its music-only channel
    { network:'kcrw', name:'Eclectic24', genre:'Eclectic DJ mix', url:'https://kcrw.streamguys1.com/kcrw_128k_aac_e24' },

    // NTS — two live channels plus a few Infinite Mixtapes
    { network:'nts', name:'NTS 1',          genre:'Underground · global',   url:'https://stream-relay-geo.ntslive.net/stream' },
    { network:'nts', name:'NTS 2',          genre:'Leftfield · experimental', url:'https://stream-relay-geo.ntslive.net/stream2' },
    { network:'nts', name:'Poolside',       genre:'Balearic · disco',       url:'https://stream-mixtape-geo.ntslive.net/mixtape4' },
    { network:'nts', name:'Slow Focus',     genre:'Ambient · drone',        url:'https://stream-mixtape-geo.ntslive.net/mixtape' },
    { network:'nts', name:'Memory Lane',    genre:'Psych folk · garage',    url:'https://stream-mixtape-geo.ntslive.net/mixtape6' },
    { network:'nts', name:'4 to the Floor', genre:'House · club',           url:'https://stream-mixtape-geo.ntslive.net/mixtape5' },
  ];

  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';

  let currentIndex = null;
  let activeNetwork = networks[0].id;

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const stationName = document.getElementById('stationName');
  const stationSub = document.getElementById('stationSub');
  const statusEl = document.getElementById('status');
  const tabsEl = document.getElementById('tabs');
  const tabUnderline = document.getElementById('tabUnderline');
  const presetList = document.getElementById('presetList');
  const liveIndicator = document.getElementById('liveIndicator');

  function pad(n){ return String(n).padStart(2, '0'); }
  function networkLabel(id){ return networks.find(n => n.id === id).label; }

  function buildTabs(){
    networks.forEach(net => {
      const tab = document.createElement('button');
      tab.className = 'tab';
      tab.textContent = net.label;
      tab.dataset.id = net.id;
      tab.addEventListener('click', () => selectNetwork(net.id));
      tabsEl.appendChild(tab);
    });
  }

  function selectNetwork(id){
    activeNetwork = id;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.id === id);
    });
    positionUnderline();
    renderPresetList();
  }

  function positionUnderline(){
    const activeTab = document.querySelector('.tab.active');
    if(!activeTab) return;
    tabUnderline.style.left = activeTab.offsetLeft + 'px';
    tabUnderline.style.width = activeTab.offsetWidth + 'px';
  }

  function renderPresetList(){
    presetList.innerHTML = '';
    const filtered = stations.filter(s => s.network === activeNetwork);
    filtered.forEach((s, i) => {
      const globalIndex = stations.indexOf(s);
      const li = document.createElement('li');
      li.className = 'presetRow';
      if(globalIndex === currentIndex) li.classList.add('active');
      li.innerHTML =
        '<span class="presetNum">' + pad(i + 1) + '</span>' +
        '<span class="presetInfo">' +
          '<span class="presetName">' + s.name + '</span>' +
          '<span class="presetMeta">' + s.genre + '</span>' +
        '</span>' +
        '<span class="presetPlay">NOW</span>';
      li.addEventListener('click', () => selectStation(globalIndex));
      presetList.appendChild(li);
    });
  }

  function selectStation(i){
    currentIndex = i;
    const s = stations[i];
    stationName.textContent = s.name;
    stationSub.textContent = networkLabel(s.network) + ' · ' + s.genre;
    playBtn.disabled = false;
    if(activeNetwork !== s.network){ selectNetwork(s.network); }
    else { renderPresetList(); }
    playCurrent();
  }

  function playCurrent(){
    if(currentIndex === null) return;
    const s = stations[currentIndex];
    if(audio.src !== s.url){ audio.src = s.url; }
    statusEl.textContent = 'Connecting…';
    audio.play().catch(() => {
      statusEl.textContent = "Couldn't connect — try another preset";
    });
  }

  function stepStation(delta){
    if(currentIndex === null) return;
    const filtered = stations.filter(s => s.network === activeNetwork);
    const curFiltered = filtered.findIndex(s => stations.indexOf(s) === currentIndex);
    if(curFiltered === -1) return;
    const next = Math.min(filtered.length - 1, Math.max(0, curFiltered + delta));
    selectStation(stations.indexOf(filtered[next]));
  }

  function updatePlayIcon(isPlaying){
    playBtn.innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG;
    playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
    playBtn.classList.toggle('playing', isPlaying);
  }

  audio.addEventListener('playing', () => {
    statusEl.textContent = '';
    updatePlayIcon(true);
    liveIndicator.classList.add('on');
    if('mediaSession' in navigator && currentIndex !== null){
      const s = stations[currentIndex];
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.name, artist: networkLabel(s.network), album: s.genre
      });
      navigator.mediaSession.playbackState = 'playing';
    }
  });

  audio.addEventListener('waiting', () => { statusEl.textContent = 'Buffering…'; });

  audio.addEventListener('error', () => {
    statusEl.textContent = "Couldn't connect — try another preset";
    updatePlayIcon(false);
    liveIndicator.classList.remove('on');
  });

  audio.addEventListener('pause', () => {
    updatePlayIcon(false);
    liveIndicator.classList.remove('on');
    if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  });

  playBtn.addEventListener('click', () => {
    if(currentIndex === null) return;
    if(audio.paused){ audio.play().catch(() => {}); }
    else { audio.pause(); }
  });

  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => stepStation(-1));
    navigator.mediaSession.setActionHandler('nexttrack', () => stepStation(1));
  }

  window.addEventListener('resize', positionUnderline);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(positionUnderline);
  }

  buildTabs();
  selectNetwork(activeNetwork);
  updatePlayIcon(false);
</script>
</body>
</html>
